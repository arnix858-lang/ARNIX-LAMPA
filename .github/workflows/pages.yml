name: Build and publish full Lampa source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'plugins/**'
      - 'index/**'
      - 'gulpfile.js'
      - 'package.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: arnix-lampa-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ARNIX-LAMPA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import complete upstream Lampa source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/yumata/lampa-source.git /tmp/lampa-source
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/lampa-source/ ./
          cat > README.md <<'EOF'
          # ARNIX LAMPA

          Полный исходный проект Lampa, импортированный из https://github.com/yumata/lampa-source с сохранением исходных каталогов, модулей, плагинов, ресурсов и лицензии.

          ## Сборка и запуск
          Требуется Node.js 18 или совместимая версия.
          ```bash
          npm install
          npx gulp pack_github
          ```
          Готовая веб-сборка появится в `build/github/lampa/`.

          ## Публикация
          GitHub Actions собирает проект и публикует содержимое `build/github/lampa/` в GitHub Pages.

          ## Источник и лицензия
          Исходный проект: https://github.com/yumata/lampa-source
          Сохраняйте файл LICENSE и уведомления об авторских правах. См. лицензию GPL-2.0 в корне репозитория.
          ARNIX LAMPA — пользовательская сборка; это не официальный сайт разработчиков Lampa.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import full Lampa source into ARNIX-LAMPA"
            git push origin HEAD:main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build full Lampa web package
        run: |
          npx gulp pack_github
          test -s build/github/lampa/index.html
          test -s build/github/lampa/app.min.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/github/lampa

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
